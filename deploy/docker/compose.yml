services:
  quorum1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-node-id=1", "-client-addr=:8080", "-peer-addr=:9000", "-data-dir=/data"]
    ports:
      - "8081:8080"
    volumes:
      - quorum1-data:/data
  quorum2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-node-id=2", "-client-addr=:8080", "-peer-addr=:9000", "-data-dir=/data"]
    ports:
      - "8082:8080"
    volumes:
      - quorum2-data:/data
  quorum3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-node-id=3", "-client-addr=:8080", "-peer-addr=:9000", "-data-dir=/data"]
    ports:
      - "8083:8080"
    volumes:
      - quorum3-data:/data

volumes:
  quorum1-data:
  quorum2-data:
  quorum3-data:

