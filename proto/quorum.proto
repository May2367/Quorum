syntax = "proto3";

package quorum.v1;

option go_package = "quorum/proto;proto";

service Quorum {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CompareAndSwap(CompareAndSwapRequest) returns (CompareAndSwapResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

service Lock {
  rpc Acquire(AcquireLockRequest) returns (LockResponse);
  rpc KeepAlive(KeepAliveLockRequest) returns (LockResponse);
  rpc Release(ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc Advance(AdvanceLockRequest) returns (AdvanceLockResponse);
}

service Ledger {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

service RaftPeer {
  rpc Send(RaftMessage) returns (RaftMessages);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  uint64 revision = 2;
}

message PutRequest {
  string key = 1;
  string value = 2;
  string client_id = 3;
  uint64 sequence = 4;
}

message PutResponse {
  uint64 revision = 1;
}

message DeleteRequest {
  string key = 1;
  string client_id = 2;
  uint64 sequence = 3;
}

message DeleteResponse {
  uint64 revision = 1;
}

message CompareAndSwapRequest {
  string key = 1;
  string expected = 2;
  string value = 3;
  string client_id = 4;
  uint64 sequence = 5;
}

message CompareAndSwapResponse {
  bool swapped = 1;
  string current = 2;
  uint64 revision = 3;
}

message WatchRequest {
  string prefix = 1;
  uint64 after_revision = 2;
}

message WatchEvent {
  string key = 1;
  string value = 2;
  uint64 revision = 3;
  bool deleted = 4;
}

message AcquireLockRequest {
  string name = 1;
  string holder = 2;
  uint64 ttl_ticks = 3;
}

message KeepAliveLockRequest {
  string name = 1;
  string holder = 2;
  uint64 ttl_ticks = 3;
}

message ReleaseLockRequest {
  string name = 1;
  string holder = 2;
}

message LockResponse {
  string name = 1;
  string holder = 2;
  uint64 fencing_token = 3;
  uint64 expires_at = 4;
  bool acquired = 5;
}

message ReleaseLockResponse {}

message AdvanceLockRequest {
  uint64 ticks = 1;
}

message AdvanceLockResponse {
  uint64 current_tick = 1;
}

message CreateAccountRequest {
  string account_id = 1;
  int64 initial_cents = 2;
}

message CreateAccountResponse {}

message TransferRequest {
  string from_account = 1;
  string to_account = 2;
  int64 cents = 3;
  string idempotency_key = 4;
  uint64 fencing_token = 5;
}

message TransferResponse {
  int64 from_balance = 1;
  int64 to_balance = 2;
  uint64 revision = 3;
  bool applied = 4;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
}

message RaftEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

message RaftMessage {
  uint32 type = 1;
  uint64 from = 2;
  uint64 to = 3;
  uint64 term = 4;
  uint64 log_term = 5;
  uint64 index = 6;
  uint64 commit = 7;
  repeated RaftEntry entries = 8;
  bool reject = 9;
  uint64 reject_hint = 10;
  bytes context = 11;
}

message RaftMessages {
  repeated RaftMessage messages = 1;
}
